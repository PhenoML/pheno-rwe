[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pheno-rwe"
version = "0.1.0"
description = "A local-first, traceable real-world-evidence study engine for FHIR and OMOP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "PhenoML" }]
dependencies = [
  "duckdb>=1.0,<2",
  "httpx>=0.27,<1",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "rich>=13.7,<15",
  "tenacity>=8.3,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
phenoml = ["phenoml>=17,<18"]
analysis = [
  "lifelines>=0.29,<1",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "tableone>=0.9,<1",
  "umap-learn>=0.5,<1",
]
[project.scripts]
pheno-rwe = "pheno_rwe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pheno_rwe"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer expresses CLI parameters as calls in argument defaults (including the
# repeatable list options used by the discovery commands); these builders return
# immutable descriptors, so they are safe despite B006/B008.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.8",
]
